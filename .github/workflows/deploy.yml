name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          VITE_ORDER_API_URL: ${{ vars.VITE_ORDER_API_URL }}
          VITE_MARKET_WS_URL: ${{ vars.VITE_MARKET_WS_URL }}
          # PostHog's project key is write-only and ships in the client bundle
          # by design, so it is a build-time variable. Unset (a fork, a local
          # build) means posthog-js is not in the bundle at all.
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=trading-ui
